{% extends "feed/base.html" %}

{% block content %}
<div class="pixo-card bg-white p-6 rounded-xl space-y-6">

    <div class="border-b border-stone-200 pb-4">
        <h2 class="font-pixel text-2xl text-emerald-800 font-bold">
            Edit Profile
        </h2>
        <p class="text-xs text-stone-500 font-pixel">
            Customize how your account appears across Pixo.
        </p>
    </div>

    <form method="post"
          action="{% url 'edit_profile' user.username %}"
          enctype="multipart/form-data"
          class="space-y-4 font-pixel">

        {% csrf_token %}

        <div class="flex items-center gap-4 p-3 bg-stone-50 rounded-lg border border-stone-200">

            {% if profile.avatar %}
                <img src="{{ profile.avatar.url }}"
                     alt="Profile picture"
                     class="w-16 h-16 rounded-full object-cover border-2 border-stone-800">
            {% else %}
                <div class="w-16 h-16 rounded-full border-2 border-stone-800 bg-emerald-100 flex items-center justify-center text-2xl font-bold text-emerald-900">
                    {{ user.username|slice:":1"|upper }}
                </div>
            {% endif %}

            <div class="space-y-1">
                <label for="avatar"
                       class="block text-xs font-bold text-stone-700">
                    Profile Picture
                </label>

                <input type="file"
                       name="avatar"
                       id="avatar"
                       accept="image/png,image/jpeg"
                       class="text-xs">
            </div>
        </div>

        <div>
            <label for="bio"
                   class="block text-xs font-bold text-stone-700 mb-1">
                Bio
            </label>

            <textarea name="bio"
                      id="bio"
                      rows="4"
                      class="w-full border border-stone-300 rounded-lg p-3 text-sm"
                      placeholder="Tell us about yourself...">{{ profile.bio|default_if_none:"" }}</textarea>
        </div>

        <div class="flex justify-end gap-2 pt-4 border-t border-stone-200">

            <a href="{% url 'profile' user.username %}"
               class="px-4 py-2 text-xs font-semibold text-stone-600 hover:text-stone-900">
                Cancel
            </a>

            <button type="submit"
                    class="pixo-btn bg-emerald-700 text-white text-xs font-bold px-5 py-2 rounded">
                Save Changes
            </button>

        </div>
    </form>
</div>
{% endblock %}
