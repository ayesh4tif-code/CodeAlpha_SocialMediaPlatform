{% extends "feed/base.html" %}

{% block content %}
<div class="max-w-md mx-auto bg-white dark:bg-stone-800 p-8 rounded-2xl border border-stone-200 dark:border-stone-700 shadow-sm space-y-6">
    <div class="text-center space-y-2">
        <h2 class="text-3xl font-bold text-[#005a36] dark:text-emerald-400">Log In to PIXO</h2>
        <p class="text-stone-500 dark:text-stone-400 text-sm">Welcome back! Access your feed and connections.</p>
    </div>

    {% if form.errors %}
        <div class="bg-rose-50 dark:bg-rose-950/50 border border-rose-200 dark:border-rose-800 text-rose-600 dark:text-rose-400 p-3 rounded-xl text-sm text-center">
            Your username and password didn't match. Please try again.
        </div>
    {% endif %}

    <form method="post" action="{% url 'login' %}" class="space-y-4">
        {% csrf_token %}
        <div>
            <label for="id_username" class="block text-sm font-bold text-stone-700 dark:text-stone-300 mb-1">Username</label>
            <input type="text" name="username" id="id_username" required
                   class="w-full bg-[#f9f9f6] dark:bg-stone-700 border border-stone-200 dark:border-stone-600 px-4 py-2 rounded-xl text-lg focus:outline-none focus:ring-2 focus:ring-[#005a36]">
        </div>
        <div>
            <label for="id_password" class="block text-sm font-bold text-stone-700 dark:text-stone-300 mb-1">Password</label>
            <input type="password" name="password" id="id_password" required
                   class="w-full bg-[#f9f9f6] dark:bg-stone-700 border border-stone-200 dark:border-stone-600 px-4 py-2 rounded-xl text-lg focus:outline-none focus:ring-2 focus:ring-[#005a36]">
        </div>

        <button type="submit"
                class="w-full bg-[#005a36] text-white py-2.5 rounded-xl font-bold border-b-4 border-[#003822] hover:bg-[#007044] active:border-b-0 active:translate-y-0.5 transition-all">
            Log In
        </button>
    </form>

    <div class="text-center pt-2 border-t border-stone-100 dark:border-stone-700 text-sm">
        Don't have an account? <a href="{% url 'signup' %}" class="text-[#005a36] dark:text-emerald-400 font-bold hover:underline">Sign up here</a>
    </div>
</div>
{% endblock %}
